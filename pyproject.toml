[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data_voley"
version = "0.1.0"
description = "Advanced Volleyball Spatial & Tactical Analytics Engine (Homography 3D-to-2D, FIVB R1-R6 State Machine & Hybrid AI/Hotkey Tagging)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Adrián (Kekkan74)" }
]
dependencies = [
    "numpy>=1.26.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
vision = [
    "opencv-python>=4.9.0",
    "ultralytics>=8.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
